{% extends "base.html" %}
{% block title %}Verify email - CampusRide{% endblock %}
{% block content %}
<div class="card" style="max-width:460px">
  <h1>Verify your email</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Email</label><input name="email" type="email" value="{{ email }}" required>
    <label>6-digit code</label><input name="code" inputmode="numeric" maxlength="6" required>
    <p class="muted">The code is valid for 10 minutes.</p>
    <button type="submit">Verify</button>
  </form>
</div>
{% endblock %}
