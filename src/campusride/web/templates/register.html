{% extends "base.html" %}
{% block title %}Register - CampusRide{% endblock %}
{% block content %}
<div class="card" style="max-width:460px">
  <h1>Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Institutional email</label><input name="email" type="email" placeholder="you@example.edu" required>
    <label>Name</label><input name="name" required>
    <label>Password</label><input name="password" type="password" required>
    <p class="muted">At least 8 characters, with letters and digits.</p>
    <button type="submit">Register</button>
  </form>
</div>
{% endblock %}
